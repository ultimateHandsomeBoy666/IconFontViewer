<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>IconFontViewer Panel - Design Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #1e1f22;
    color: #bcbec4;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .dialog {
    width: 620px;
    background: #2b2d30;
    border-radius: 12px;
    border: 1px solid #393b40;
    overflow: hidden;
    box-shadow: 0 24px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
  }

  /* — Summary Bar — */
  .summary-bar {
    padding: 16px 24px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #393b40;
  }
  .summary-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-count {
    font-size: 13px;
    color: #6e7078;
  }
  .summary-count strong {
    color: #bcbec4;
    font-weight: 600;
  }
  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #4e5157;
  }
  .summary-enabled {
    font-size: 12px;
    color: #5a9e6f;
    font-weight: 500;
  }

  /* — Font List — */
  .font-list {
    max-height: 380px;
    overflow-y: auto;
  }
  .font-list::-webkit-scrollbar { width: 6px; }
  .font-list::-webkit-scrollbar-track { background: transparent; }
  .font-list::-webkit-scrollbar-thumb { background: #4e5157; border-radius: 3px; }

  .font-item {
    display: flex;
    align-items: center;
    padding: 14px 24px;
    gap: 14px;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .font-item:last-child { border-bottom: none; }
  .font-item:hover {
    background: rgba(255,255,255,0.03);
  }
  .font-item.disabled .font-details .font-name,
  .font-item.disabled .font-indicator {
    opacity: 0.45;
  }

  /* Indicator */
  .font-indicator {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .font-indicator.on {
    background: linear-gradient(135deg, #4c7fef, #6366f1);
  }
  .font-indicator.off {
    background: #43454a;
  }

  /* Details */
  .font-details {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .font-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .font-name {
    font-size: 13.5px;
    font-weight: 600;
    color: #dfe1e5;
    transition: opacity 0.2s;
  }
  .source-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .source-tag.project {
    background: rgba(74, 158, 98, 0.15);
    color: #5a9e6f;
  }
  .source-tag.aar {
    background: rgba(76, 127, 239, 0.15);
    color: #6b9ef0;
  }
  .source-tag.user {
    background: rgba(217, 158, 60, 0.15);
    color: #c9923c;
  }
  .font-path {
    font-size: 11.5px;
    color: #6e7078;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 380px;
  }

  /* Controls */
  .font-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  /* Toggle Switch */
  .toggle {
    width: 36px;
    height: 20px;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle.on {
    background: #4c7fef;
  }
  .toggle.off {
    background: #4e5157;
  }
  .toggle .thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    top: 2px;
    transition: left 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toggle.on .thumb { left: 18px; }
  .toggle.off .thumb { left: 2px; }

  /* Delete */
  .delete-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #6e7078;
    font-size: 14px;
    transition: all 0.15s;
    border: none;
    background: none;
  }
  .delete-btn:hover {
    background: rgba(255, 80, 80, 0.1);
    color: #e55c5c;
  }

  /* — Footer — */
  .footer {
    padding: 14px 24px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid #393b40;
  }
  .btn {
    padding: 7px 18px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
  }
  .btn-secondary {
    background: transparent;
    color: #8c8f96;
    border: 1px solid #4e5157;
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.04);
    color: #bcbec4;
    border-color: #6e7078;
  }
  .btn-primary {
    background: #4c7fef;
    color: #fff;
  }
  .btn-primary:hover {
    background: #5a8cf5;
  }

  /* — Empty State — */
  .empty-state {
    padding: 64px 24px;
    text-align: center;
    display: none;
  }
  .empty-icon {
    font-size: 40px;
    margin-bottom: 16px;
    opacity: 0.3;
  }
  .empty-title {
    font-size: 14px;
    color: #8c8f96;
    margin-bottom: 6px;
  }
  .empty-desc {
    font-size: 12px;
    color: #5a5c63;
  }
</style>
</head>
<body>

<div class="dialog">

  <!-- Summary Bar -->
  <div class="summary-bar">
    <div class="summary-left">
      <span class="summary-count"><strong>3</strong> fonts</span>
      <span class="dot"></span>
      <span class="summary-enabled">1 enabled</span>
    </div>
  </div>

  <!-- Font List -->
  <div class="font-list">

    <!-- Enabled font -->
    <div class="font-item">
      <div class="font-indicator on">T</div>
      <div class="font-details">
        <div class="font-name-row">
          <span class="font-name">feather_icons.ttf</span>
          <span class="source-tag project">PROJECT</span>
        </div>
        <span class="font-path">.../iconfont-lib/src/main/assets/fonts/feather_icons.ttf</span>
      </div>
      <div class="font-controls">
        <div class="toggle on"><div class="thumb"></div></div>
        <button class="delete-btn">&#x2715;</button>
      </div>
    </div>

    <!-- Disabled font -->
    <div class="font-item disabled">
      <div class="font-indicator off">T</div>
      <div class="font-details">
        <div class="font-name-row">
          <span class="font-name">material_icons.ttf</span>
          <span class="source-tag project">PROJECT</span>
        </div>
        <span class="font-path">.../app/src/main/res/font/material_icons.ttf</span>
      </div>
      <div class="font-controls">
        <div class="toggle off"><div class="thumb"></div></div>
        <button class="delete-btn">&#x2715;</button>
      </div>
    </div>

    <!-- AAR font -->
    <div class="font-item disabled">
      <div class="font-indicator off">T</div>
      <div class="font-details">
        <div class="font-name-row">
          <span class="font-name">material_icons.ttf</span>
          <span class="source-tag aar">AAR</span>
        </div>
        <span class="font-path">.../app/src/main/assets/fonts/material_icons.ttf</span>
      </div>
      <div class="font-controls">
        <div class="toggle off"><div class="thumb"></div></div>
        <button class="delete-btn">&#x2715;</button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn btn-secondary">重新扫描</button>
    <button class="btn btn-primary">+ 添加 TTF</button>
  </div>

</div>

</body>
</html>
